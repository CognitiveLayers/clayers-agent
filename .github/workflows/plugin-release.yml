name: Plugin Release Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  plugin-release:
    name: Plugin release checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Clayers CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clayers==$(tr -d '[:space:]' < claude-plugin/CLAYERS_VERSION)"

      - name: Run release checks
        run: scripts/check-release
